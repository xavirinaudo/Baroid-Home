        const pkgSizeVal = parseFloat(add.packageSize) || (add.isLiquid ? 5 : 50);

        let pkg = pkgSizeVal;
        if (add.isLiquid) {
          pkg = pkgSizeVal * sg * 8.345; // pkg size in lbs
        }

        const ppgEq = sg * 8.345;
        const ppbEq = ppgEq * 42;
        const totalLbs = conc * vf;
        const volDisp = ppbEq > 0 ? totalLbs / ppbEq : 0;
        const ratio = volDisp * ppgEq;

        F_total += volDisp;
        G_total += ratio;

        return {
          ...add,
          ppgEq,
          ppbEq,
          totalLbs,
          volDisp,
          ratio,
          pkg
        };
      });

      // 2. Densidad de la Fase Fluida
      const dFaseFluida = Math.round(((dNap * owrOil) + (dBrine * owrWater)) / 100 * 100) / 100;

      // 3. Balance de Masa (Densificante)
      if (dWm <= dFaseFluida) {
        return { invalid: true, msg: lang === 'es' ? 'La densidad del densificante debe ser mayor que la de la fase fluida.' : 'Weighting material density must be greater than fluid phase density.' };
      }

      const numerator = (vf * df) - ((vf - F_total) * dFaseFluida) - G_total;
      const denominator = dWm - dFaseFluida;
      const volWM = numerator / denominator; // bbl

      if (volWM < 0 || volWM + F_total > vf) {
        return { invalid: true, isUnfeasible: true, msg: t.formUnfeasible };
      }

      // 4. Desglose Final
      const volFaseFluida = vf - volWM - F_total;
      const volNap = volFaseFluida * (owrOil / 100);
      const volBrine = volFaseFluida * (owrWater / 100);
      
      const volWater = volBrine * wf;
      const massSalt = volBrine * saltConc; // lbs
      
      const massSalt_kg = massSalt / 2.20462;
      const sacksSalt = unitMode === 'metric' 
        ? Math.ceil(massSalt_kg / 25) // 25 kg bags
        : Math.ceil(massSalt / 50);          // 50 lb bags
      
      const massWM = volWM * dWm * 42; // lbs
      const massWM_kg = massWM / 2.20462;
      const sacksWM = unitMode === 'metric'
        ? Math.ceil(massWM_kg / 50)  // 50 kg bags
        : Math.ceil(massWM / 100);           // 100 lb bags

      // Aditivos
      const finalAdditives = abcAdditives.map(add => {
        const totalLbs = add.totalLbs;
        const totalKg = totalLbs / 2.20462;
        const sgVal = parseFloat(add.sg) || 1.0;
        const pkgSizeVal = parseFloat(add.packageSize) || (add.isLiquid ? 5 : 50);
        
        let totalVal = 0;
        let totalValMetric = 0;
        let unitLabelField = 'lb';
        let unitLabelMetric = 'kg';
        let sacks = 0;

        if (add.isLiquid) {
          const totalGal = totalLbs / (sgVal * 8.345);
          const totalLiters = totalKg / sgVal;
          totalVal = totalGal;
          totalValMetric = totalLiters;
          unitLabelField = 'gal';
          unitLabelMetric = 'lt';
          sacks = Math.ceil(totalGal / pkgSizeVal);
        } else {
          totalVal = totalLbs;
          totalValMetric = totalKg;
          unitLabelField = 'lb';
          unitLabelMetric = 'kg';
          sacks = Math.ceil(totalLbs / pkgSizeVal);
        }

        return {
          name: add.name,
          isLiquid: add.isLiquid,
          concentration: getAddConcValue(add),
          totalLbs: totalLbs,
          totalKg: totalKg,
          volDisp: add.volDisp,
          sacks: sacks,
          pkgSize: getAddPkgValue(add),
          totalVal,
          totalValMetric,
          unitLabelField,
          unitLabelMetric
        };
      });

      return {
        invalid: false,
        type: 'obm',
        abcAdditives,
        fTotal: F_total,
        fTotal_m3: F_total * 0.158987,
        gTotal: G_total,
        dFaseFluida,
        dFaseFluida_gL: dFaseFluida * 119.826,
        dFaseFluida_sg: dFaseFluida / 8.345,
        volWM,
        volWM_m3: volWM * 0.158987,
        massWM,
        massWM_kg,
        sacksWM,
        volFaseFluida,
        volFaseFluida_m3: volFaseFluida * 0.158987,
        volNap,
        volNap_m3: volNap * 0.158987,
        volBrine,
        volBrine_m3: volBrine * 0.158987,
        volWater,
        volWater_m3: volWater * 0.158987,
        massSalt,
        massSalt_kg,
        sacksSalt,
        finalAdditives,
        vf,
        df
      };
    } else {
      // WBM Mode
      const d1 = parseFloat(formSystem.wbmD1) || 0;
      const d2 = parseFloat(formSystem.wbmD2) || 0;
      const wbmMode = formSystem.wbmMode;

      // 1. Desplazamiento de Aditivos (WBM)
      let V_c = 0; // bbl
      let G_total = 0; // bbl * ppg
      const abcAdditives = wbmAdditives.map(add => {
        const sg = parseFloat(add.sg) || 1.0;
        const conc = parseFloat(add.concentration) || 0; // ppb
        const pkgSizeVal = parseFloat(add.packageSize) || (add.isLiquid ? 5 : 50);

        let pkg = pkgSizeVal;
        if (add.isLiquid) {
          pkg = pkgSizeVal * sg * 8.345;
        }

        const ppgEq = sg * 8.345;
        const ppbEq = ppgEq * 42;
        const totalLbs = conc * vf;
        const volDisp = ppbEq > 0 ? totalLbs / ppbEq : 0;
        const ratio = volDisp * ppgEq;

        V_c += volDisp;
        G_total += ratio;

        return {
          ...add,
          ppgEq,
          ppbEq,
          totalLbs,
          volDisp,
          ratio,
          pkg
        };
      });

      if (wbmMode === 'weights') {
        if (Math.abs(d1 - d2) < 0.001) {
          return { invalid: true, isSameDensity: true, msg: t.formSameDensity };
        }

        const v1 = (vf * (df - d2) + V_c * d2 - G_total) / (d1 - d2);
        const v2 = vf - v1 - V_c;

        if (v1 < 0 || v2 < 0) {
          return { invalid: true, isUnfeasible: true, msg: t.formUnfeasible };
        }

        const finalAdditives = abcAdditives.map(add => {
          const totalLbs = add.totalLbs;
          const totalKg = totalLbs / 2.20462;
          const sgVal = parseFloat(add.sg) || 1.0;
          const pkgSizeVal = parseFloat(add.packageSize) || (add.isLiquid ? 5 : 50);
          
          let totalVal = 0;
          let totalValMetric = 0;
          let unitLabelField = 'lb';
          let unitLabelMetric = 'kg';
          let sacks = 0;

          if (add.isLiquid) {
            const totalGal = totalLbs / (sgVal * 8.345);
            const totalLiters = totalKg / sgVal;
            totalVal = totalGal;
            totalValMetric = totalLiters;
            unitLabelField = 'gal';
            unitLabelMetric = 'lt';
            sacks = Math.ceil(totalGal / pkgSizeVal);
          } else {
            totalVal = totalLbs;
            totalValMetric = totalKg;
            unitLabelField = 'lb';
            unitLabelMetric = 'kg';
            sacks = Math.ceil(totalLbs / pkgSizeVal);
          }

          return {
            name: add.name,
            isLiquid: add.isLiquid,
            concentration: getAddConcValue(add),
            totalLbs: totalLbs,
            totalKg: totalKg,
            volDisp: add.volDisp,
            sacks: sacks,
            pkgSize: getAddPkgValue(add),
            totalVal,
            totalValMetric,
            unitLabelField,
            unitLabelMetric
          };
        });

        return {
          invalid: false,
          type: 'wbm',
          mode: 'weights',
          abcAdditives,
          v1: unitMode === 'metric' ? v1 * 0.158987 : v1,
          v2: unitMode === 'metric' ? v2 * 0.158987 : v2,
          v1_bbl: v1,
          v2_bbl: v2,
          v1_m3: v1 * 0.158987,
          v2_m3: v2 * 0.158987,
          vc: V_c,
          vc_m3: V_c * 0.158987,
          gTotal: G_total,
          vf: unitMode === 'metric' ? vf * 0.158987 : vf,
          df: unitMode === 'metric' ? df * 119.826 : df,
          vf_bbl: vf,
          df_ppg: df,
          v1_display: v1,
          v2_display: v2,
          d1: d1,
          d2: d2,
          finalAdditives
        };
      } else {
        // Blend Mode
        let v1 = parseFloat(formSystem.wbmV1) || 0;
        let v2 = parseFloat(formSystem.wbmV2) || 0;

        const vFinalCalculated = v1 + v2 + V_c; // bbl
        const dFinalCalculated = vFinalCalculated > 0 ? (v1 * d1 + v2 * d2 + G_total) / vFinalCalculated : 0; // ppg

        const finalAdditives = abcAdditives.map(add => {
          const totalLbs = add.totalLbs;
          const totalKg = totalLbs / 2.20462;
          const sgVal = parseFloat(add.sg) || 1.0;
          const pkgSizeVal = parseFloat(add.packageSize) || (add.isLiquid ? 5 : 50);
          
          let totalVal = 0;
          let totalValMetric = 0;
          let unitLabelField = 'lb';
          let unitLabelMetric = 'kg';
          let sacks = 0;

          if (add.isLiquid) {
            const totalGal = totalLbs / (sgVal * 8.345);
            const totalLiters = totalKg / sgVal;
            totalVal = totalGal;
            totalValMetric = totalLiters;
            unitLabelField = 'gal';
            unitLabelMetric = 'lt';
            sacks = Math.ceil(totalGal / pkgSizeVal);
          } else {
            totalVal = totalLbs;
            totalValMetric = totalKg;
            unitLabelField = 'lb';
            unitLabelMetric = 'kg';
            sacks = Math.ceil(totalLbs / pkgSizeVal);
          }

          return {
            name: add.name,
            isLiquid: add.isLiquid,
            concentration: getAddConcValue(add),
            totalLbs: totalLbs,
            totalKg: totalKg,
            volDisp: add.volDisp,
            sacks: sacks,
            pkgSize: getAddPkgValue(add),
            totalVal,
            totalValMetric,
            unitLabelField,
            unitLabelMetric
          };
        });

        return {
          invalid: false,
          type: 'wbm',
          mode: 'blend',
          abcAdditives,
          v1: unitMode === 'metric' ? v1 * 0.158987 : v1,
          v2: unitMode === 'metric' ? v2 * 0.158987 : v2,
          v1_bbl: v1,
          v2_bbl: v2,
          v1_m3: v1 * 0.158987,
          v2_m3: v2 * 0.158987,
          vc: V_c,
          vc_m3: V_c * 0.158987,
          gTotal: G_total,
          vf: unitMode === 'metric' ? vFinalCalculated * 0.158987 : vFinalCalculated,
          df: unitMode === 'metric' ? dFinalCalculated * 119.826 : dFinalCalculated,
          vf_bbl: vFinalCalculated,
          df_ppg: dFinalCalculated,
          v1_display: v1,
          v2_display: v2,
          d1: d1,
          d2: d2,
          finalAdditives
        };
      }
    }
  };
  // GA4 calculator_used tracking with 2-second debounce for formulations
  const isFirstRenderForm = React.useRef(true);
  const lastTrackedFormulation = React.useRef({
    type: formType,
    system: JSON.stringify(formSystem),
    obm: JSON.stringify(obmAdditives),

      const systemStr = JSON.stringify(formSystem);

      if (
        lastTrackedFormulation.current.type !== formType ||
        lastTrackedFormulation.current.system !== systemStr ||
        lastTrackedFormulation.current.obm !== obmStr ||
        lastTrackedFormulation.current.wbm !== wbmStr

        lastTrackedFormulation.current = {
          type: formType,

        };

        if (typeof gtag === 'function') {
          gtag('event', 'calculator_used', {
            calculator_name: name,
            status: status
          });
        }
      }
    }, 2000);

    return () => clearTimeout(timer);
  }, [formType, formSystem, obmAdditives, wbmAdditives]);

            type: fluidSystems[0]?.id || 'WBM',
            x: 50,
            y: 50,
            rotated: false,
            w: 120,
            h: 105
        };

        if (e.target.closest('input') || e.target.closest('button') || e.target.closest('select')) return;

        if (id) {

            let nextSelection = selectedIds;

            pits.forEach(p => {
                if (nextSelection.includes(p.id)) {
                    startData[p.id] = { x: p.x, y: p.y, w: p.w, h: p.h };
                }
            });
            setGroupStartStates(startData);

            const pit = pits.find(p => p.id === id);
            if (e.target.closest('.resize-handle')) {
                setResizingPitId(id);
                setResizeStart({ w: pit.w, h: pit.h, x: eventClientX, y: eventClientY });
            } else {
                setDraggingPitId(id);
                setDragOffset({ x: eventClientX - pit.x, y: eventClientY - pit.y });
            }
        } else {
            if (!eventShiftKey) setSelectedIds([]);
            setSelectionBox({ x: eventClientX, y: eventClientY, startX: eventClientX, startY: eventClientY, w: 0, h: 0 });
        }
    };

    const handleMouseMove = (e) => {
        const isTouch = e.type.startsWith('touch');
        const eventClientX = isTouch ? e.touches[0].clientX : e.clientX;
        const eventClientY = isTouch ? e.touches[0].clientY : e.clientY;

        if (isTouch && (draggingPitId || resizingPitId)) {
            if (e.cancelable) e.preventDefault();
        }

        const canvasEl = document.getElementById('piletas-canvas');
        if (!canvasEl) return;
        const canvasRect = canvasEl.getBoundingClientRect();
        const margin = 20;

        if (selectionBox) {
            const currentX = eventClientX;
            const currentY = eventClientY;
            const x = Math.min(currentX, selectionBox.startX);
            const y = Math.min(currentY, selectionBox.startY);
            const w = Math.abs(currentX - selectionBox.startX);
            const h = Math.abs(currentY - selectionBox.startY);
            setSelectionBox({ ...selectionBox, x, y, w, h });

            const boxInCanvas = {
                left: x - canvasRect.left,
                top: y - canvasRect.top,
                right: (x + w) - canvasRect.left,
                bottom: (y + h) - canvasRect.top
            };

            const pitsInBox = pits.filter(p => {
                const pw = p.w + 24;
                const ph = 150;
                return (p.x < boxInCanvas.right && p.x + pw > boxInCanvas.left &&
                    p.y < boxInCanvas.bottom && p.y + ph > boxInCanvas.top);
            }).map(p => p.id);
            setSelectedIds(pitsInBox);
        } else if (draggingPitId && groupStartStates) {
            const dx = eventClientX - (groupStartStates[draggingPitId].x + dragOffset.x);
            const dy = eventClientY - (groupStartStates[draggingPitId].y + dragOffset.y);

            setPits(prevPits => prevPits.map(p => {
                if (selectedIds.includes(p.id) && groupStartStates[p.id]) {
                    const s = groupStartStates[p.id];
                    return {
                        ...p,
                        x: Math.max(margin, Math.min(s.x + dx, canvasRect.width - margin - (p.w + 24))),
                        y: Math.max(margin, Math.min(s.y + dy, canvasRect.height - margin - 150))
                    };
                }
                return p;
            }));
        } else if (resizingPitId && groupStartStates) {
            const dx = eventClientX - resizeStart.x;
            const dy = eventClientY - resizeStart.y;

            setPits(prevPits => prevPits.map(p => {
                if (selectedIds.includes(p.id) && groupStartStates[p.id]) {
                    const s = groupStartStates[p.id];
                    return {
                        ...p,
                        w: Math.max(120, s.w + dx),
                        h: Math.max(105, s.h + dy)
                    };
                }
                return p;
            }));
        }
    };

    const handleMouseUp = () => {
        setDraggingPitId(null);
        setResizingPitId(null);
        setSelectionBox(null);
        setGroupStartStates(null);
    };

    const handleEnter = (e) => {
        if (e.key === 'Enter') e.target.blur();
    };

    const addFluidSystem = () => {
        const id = `SYS_${Date.now()}`;
        setFluidSystems([...fluidSystems, { id, label: lang === 'es' ? 'Nuevo' : 'New', color: 'bg-zinc-500' }]);
    };

    const updateFluidSystem = (id, field, val) => {
        setFluidSystems(fluidSystems.map(s => s.id === id ? { ...s, [field]: val } : s));
    };

    const deleteFluidSystem = (id) => {
        if (fluidSystems.length <= 1) return alert(lang === 'es' ? 'Debe haber al menos un sistema.' : 'There must be at least one system.');
        if (confirm(lang === 'es' ? '¿Eliminar este sistema? Las piletas que lo usen volverán al primero.' : 'Delete this system? Pits using it will revert to the first one.')) {
            const nextSystems = fluidSystems.filter(s => s.id !== id);
            setFluidSystems(nextSystems);
            setPits(pits.map(p => p.type === id ? { ...p, type: nextSystems[0].id } : p));
        }
    };

    const totalVol = pits.reduce((acc, p) => acc + (parseFloat(p.vol) || 0), 0);
    const totalMax = pits.reduce((acc, p) => acc + (parseFloat(p.maxVol) || 0), 0);
    const avgSG = totalVol > 0
        ? pits.reduce((acc, p) => acc + ((parseFloat(p.vol) || 0) * (parseFloat(p.density) || 1)), 0) / totalVol
        : 1.0;

    const displayDens = (sg) => {
        return unitMode === 'metric' ? (sg * 1000).toFixed(0) : (sg * 8.33).toFixed(2);
    };
    const parseDens = (val) => {
        const num = parseFloat(val) || 0;
        return unitMode === 'metric' ? num / 1000 : num / 8.33;
    };
    const getDensLabel = () => unitMode === 'metric' ? 'g/L' : 'ppg';

    const displayVol = (v) => {
        if (v === '' || v === undefined || v === null) return '';
        const num = parseFloat(v);
        if (isNaN(num)) return '';
        const converted = unitMode === 'metric' ? num : num / 0.158987;
        return Math.round(converted * 100) / 100;
    };

    const parseVol = (val) => {
        if (val === '' || val === undefined || val === null) return '';
        const num = parseFloat(val);
        if (isNaN(num)) return '';
        const converted = unitMode === 'metric' ? num : num * 0.158987;
        return Math.round(converted * 100) / 100;
    };

    const availableColors = [
        'bg-blue-600', 'bg-halliburton-red', 'bg-zinc-900', 'bg-yellow-500', 'bg-zinc-700', 'bg-sky-400',
        'bg-orange-600', 'bg-emerald-600', 'bg-amber-500', 'bg-purple-600', 'bg-zinc-500'
    ];

    const statsBySystem = fluidSystems.map(sys => {
        const vol = pits.filter(p => p.type === sys.id).reduce((acc, p) => acc + (parseFloat(p.vol) || 0), 0);
        const cap = pits.filter(p => p.type === sys.id).reduce((acc, p) => acc + (parseFloat(p.maxVol) || 0), 0);
        return { ...sys, vol, cap };
    });

    return (
        <div className="animate-fade-in space-y-4 pb-32 select-none" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onTouchMove={handleMouseMove} onTouchEnd={handleMouseUp}>
            {/* Simplified Header */}
            <div className="bg-white dark:bg-slate-900/80 p-6 rounded-[3rem] border border-zinc-100 dark:border-zinc-800 shadow-sm flex flex-col gap-6">
                <div className="flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-4">
                        <div className="flex bg-zinc-100 dark:bg-slate-800 p-1 rounded-xl border border-zinc-200 dark:border-zinc-700">
                            <button onClick={() => setUnitMode('field')} className={`px-5 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all ${unitMode === 'field' ? 'bg-halliburton-red text-white' : 'text-zinc-500'}`}>ppg</button>
                            <button onClick={() => setUnitMode('metric')} className={`px-5 py-2 rounded-lg text-xs font-black uppercase tracking-widest transition-all ${unitMode === 'metric' ? 'bg-halliburton-red text-white' : 'text-zinc-500'}`}>g/L</button>
                        </div>
                        <button onClick={() => setIsConfiguringFluids(!isConfiguringFluids)} className="bg-white dark:bg-slate-800 text-zinc-600 dark:text-zinc-400 px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-sm border border-zinc-100 dark:border-zinc-700 flex items-center gap-2 hover:bg-zinc-50 dark:hover:bg-slate-700 transition-colors">
                            <Icon name="sliders" size={14} /> {isConfiguringFluids ? t.close : t.pitsConfigFluids}
                        </button>

                        <button
                            onClick={historyPits ? undoReorder : reorderPits}
                            className={`px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-sm border transition-all flex items-center gap-2 ${historyPits ? 'bg-amber-50 dark:bg-amber-900/20 text-amber-600 border-amber-200 shadow-lg' : 'bg-white dark:bg-slate-800 text-zinc-600 dark:text-zinc-400 border-zinc-100 dark:border-zinc-700'}`}
                        >
                            <Icon name={historyPits ? "mouse-pointer" : "grid"} size={14} />
                            {historyPits ? t.pitsManualLayout : t.pitsAutoGrid}
                        </button>

                        <button onClick={addPit} className="bg-white dark:bg-slate-800 text-zinc-600 dark:text-zinc-400 px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-sm border border-zinc-100 dark:border-zinc-700 flex items-center gap-2 hover:bg-zinc-50 dark:hover:bg-slate-700 transition-colors">
                            <Icon name="plus" size={14} /> {t.pitsAddTank}
                        </button>

                        <button onClick={() => setShowFluidStats(!showFluidStats)} className={`px-6 py-3 rounded-xl text-xs font-black uppercase shadow-md flex items-center gap-2 transition-all transform hover:scale-105 ${showFluidStats ? 'bg-halliburton-red text-white' : 'bg-zinc-900 text-white'}`}>
                            <Icon name="bar-chart-2" size={16} /> {t.pitsDashboard}
                        </button>
                    </div>

                    {/* Summary Integrated */}
                    <div className="flex flex-wrap gap-8 items-center bg-zinc-50 dark:bg-slate-800/50 px-8 py-3 rounded-[2rem] border border-zinc-100 dark:border-zinc-800 shadow-inner">
                        {[
                            { label: t.pitsTotalVol, val: unitMode === 'metric' ? totalVol.toFixed(1) : (totalVol / 0.158987).toFixed(0), unit: unitMode === 'metric' ? 'm³' : 'bbl', color: 'text-halliburton-red' },
                            { label: t.pitsAvgDensity, val: displayDens(avgSG), unit: getDensLabel() },
                            { label: t.pitsCapacityLoad, val: ((totalVol / (totalMax || 1)) * 100).toFixed(1), unit: '%' }
                        ].map((stat, i) => (
                            <div key={i} className="flex items-baseline gap-2">
                                <span className="text-[10px] font-black text-zinc-400 uppercase tracking-widest">{stat.label}:</span>
                                <span className={`text-xl font-black italic ${stat.color || 'dark:text-white text-zinc-800'}`}>{stat.val}</span>
                                <span className="text-[10px] font-bold text-zinc-400 uppercase">{stat.unit}</span>
                            </div>
                        ))}
                    </div>
                </div>
            </div>

            {/* Fluid Volume Dashboard */}
            {showFluidStats && (
                <div className="bg-white dark:bg-slate-900 p-8 rounded-[3rem] border-2 border-zinc-100 dark:border-zinc-800 shadow-2xl animate-fade-in grid grid-cols-1 md:grid-cols-3 gap-6">
                    {statsBySystem.map(sys => (
                        <div key={sys.id} className="p-6 bg-zinc-50 dark:bg-slate-800/50 rounded-2xl border border-zinc-100 dark:border-zinc-700 flex flex-col gap-4 shadow-sm">
                            <div className="flex items-center gap-3">
                                <div className={`w-4 h-4 rounded-full ${sys.color}`}></div>
                                <span className="text-sm font-black uppercase tracking-widest text-zinc-600 dark:text-zinc-300">{sys.label}</span>
                            </div>
                            <div className="flex items-baseline gap-2">
                                <span className="text-3xl font-black italic text-zinc-900 dark:text-white">
                                    {unitMode === 'metric' ? sys.vol.toFixed(1) : (sys.vol / 0.158987).toFixed(0)}
                                </span>
                                <span className="text-[10px] font-bold text-zinc-400 uppercase">{unitMode === 'metric' ? 'm³' : 'bbl'}</span>
                            </div>
                            <div className="w-full h-2 bg-zinc-200 dark:bg-slate-700 rounded-full overflow-hidden">
                                <div className={`h-full ${sys.color}`} style={{ width: `${Math.min((sys.vol / (sys.cap || 1)) * 100, 100)}%` }}></div>
                            </div>
                            <span className="text-[9px] font-black text-zinc-400 uppercase">Cap: {unitMode === 'metric' ? sys.cap.toFixed(1) : (sys.cap / 0.158987).toFixed(0)} {unitMode === 'metric' ? 'm³' : 'bbl'}</span>
                        </div>
                    ))}
                </div>
            )}

            {/* Fluid Config Panel */}
            {isConfiguringFluids && (
                <div className="bg-zinc-100 dark:bg-slate-950 p-8 rounded-[3rem] border-2 border-dashed border-zinc-200 dark:border-zinc-800 animate-fade-in shadow-inner">
                    <div className="flex flex-wrap gap-4">
                        {fluidSystems.map(sys => (
                            <div key={sys.id} className="bg-white dark:bg-slate-900 p-3 pl-5 rounded-2xl flex items-center gap-4 border border-zinc-100 dark:border-zinc-800 shadow-sm">
                                <div className="relative group/color">
                                    <div className={`w-8 h-8 rounded-xl ${sys.color} shadow-inner`}></div>
                                    <div className="absolute top-0 left-0 w-full h-full opacity-0 group-hover/color:opacity-100 flex flex-wrap gap-1 p-1 bg-white shadow-2xl rounded-xl z-50 transition-opacity">
                                        {availableColors.map(c => <button key={c} onClick={() => updateFluidSystem(sys.id, 'color', c)} className={`w-3 h-3 ${c} rounded-sm`}></button>)}
                                    </div>
                                </div>
                                <input value={sys.label} onChange={e => updateFluidSystem(sys.id, 'label', e.target.value)} className="bg-transparent border-none text-[12px] font-black uppercase w-24 focus:ring-0 text-zinc-800 dark:text-zinc-100" />
                                <button onClick={() => deleteFluidSystem(sys.id)} className="text-zinc-300 hover:text-red-500 transition-colors"><Icon name="x" size={18} /></button>
                            </div>
                        ))}
                        <button onClick={addFluidSystem} className="text-xs font-black text-halliburton-red hover:text-red-700 flex items-center gap-2 p-4 transition-colors"><Icon name="plus-circle" size={20} /> {t.pitsNewSystem}</button>
                    </div>
                </div>
            )}

            {/* FREE LAYOUT CANVAS */}
            <div className="w-full overflow-x-auto custom-scrollbar no-scrollbar-at-rest rounded-[4rem]">
                <div
                    id="piletas-canvas"
                    onMouseDown={(e) => handleMouseDown(e)}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                    onTouchStart={(e) => handleMouseDown(e)}
                    className="relative bg-zinc-50 dark:bg-slate-950/40 rounded-[4rem] border-2 border-zinc-100 dark:border-zinc-800 min-h-[1200px] shadow-inner p-10 mb-20 overflow-visible"
                    style={{ cursor: (draggingPitId || resizingPitId) ? (resizingPitId ? 'se-resize' : 'grabbing') : 'default' }}
                >
                    <div className="absolute inset-0 opacity-[0.08] pointer-events-none" style={{ backgroundImage: 'radial-gradient(#52525b 1.5px, transparent 1.5px)', backgroundSize: '40px 40px' }}></div>

                    {/* Selection Box Overlay */}
                    {selectionBox && (
                        <div
                            className="absolute bg-blue-500/10 border border-blue-500/50 z-[100] pointer-events-none rounded-sm"
                            style={{
                                left: selectionBox.x - (document.getElementById('piletas-canvas')?.getBoundingClientRect().left || 0),
                                top: selectionBox.y - (document.getElementById('piletas-canvas')?.getBoundingClientRect().top || 0),
                                width: selectionBox.w,
                                height: selectionBox.h
                            }}
                        />
                    )}

                {pits.map(p => {
                    const isSelected = selectedIds.includes(p.id);
                    const curMax = parseFloat(p.maxVol) || 1;
                    const curVol = parseFloat(p.vol) || 0;
                    const fillPct = Math.min((curVol / curMax) * 100, 100);
                    const currentType = fluidSystems.find(t => t.id === p.type) || fluidSystems[0];

                    const baseW = 130;
                    const baseH = 220;
                    const wScale = p.w / baseW;
                    const hScale = p.h / baseH;
                    const globalScale = Math.min(wScale, hScale, 1.3);
                    const innerH = p.h;

                    return (
                        <div
                            key={p.id}
                            id={`pit-${p.id}`}
                            onMouseDown={(e) => handleMouseDown(e, p.id)}
                            onTouchStart={(e) => handleMouseDown(e, p.id)}
                            className={`absolute ${isSelected ? 'ring-4 ring-blue-500/30 rounded-[22px]' : ''}`}
                            style={{
                                left: `${p.x}px`,
                                top: `${p.y}px`,
                                zIndex: (draggingPitId === p.id || resizingPitId === p.id) ? 1000 : Math.floor(p.w * p.h),
                                transition: (draggingPitId || resizingPitId || selectionBox) ? 'none' : 'all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
                            }}
                        >
                            <div
                                className={`relative bg-white dark:bg-slate-900 border-[3px] shadow-2xl group/pit ${isSelected ? 'border-blue-500 shadow-blue-500/20' : 'border-zinc-300 dark:border-slate-700 shadow-black/10'} ${draggingPitId === p.id ? 'shadow-red-500/20' : ''}`}
                                style={{
                                    width: `${p.w + (24 * globalScale)}px`,
                                    padding: `${12 * globalScale}px`,
                                    borderRadius: `${20 * globalScale}px`,
                                    transition: (resizingPitId === p.id) ? 'none' : 'transform 0.2s',
                                    marginTop: '8px'
                                }}
                            >
                                {/* Subtle Clip 'Hook' Drag Handle */}
                                <div className="move-handle absolute -top-3 left-1/2 -translate-x-1/2 w-10 h-4 bg-zinc-200 dark:bg-slate-700 rounded-t-md border-x border-t border-zinc-300 dark:border-slate-600 flex flex-col gap-0.5 items-center justify-center cursor-grab active:cursor-grabbing shadow-sm z-20 hover:bg-zinc-100 dark:hover:bg-slate-600 transition-colors opacity-80 hover:opacity-100">
                                    <div className="w-5 h-0.5 bg-zinc-400 dark:bg-slate-500 rounded-full"></div>
                                    <div className="w-5 h-0.5 bg-zinc-400 dark:bg-slate-500 rounded-full opacity-30"></div>
                                </div>

                                <div className="flex items-center gap-1 px-1" style={{ marginBottom: `${8 * globalScale}px` }}>
                                    <input
                                        value={lang === 'en' ? (defaultSpanishNames[p.name] || p.name) : p.name}
                                        onChange={e => updatePit(p.id, 'name', e.target.value)}
                                        onKeyDown={handleEnter}
                                        style={{ fontSize: `${Math.max(13, 11 * globalScale)}px`, width: '100%' }}
                                        className="bg-transparent border-none font-black uppercase text-zinc-500 focus:ring-0 truncate italic tracking-wider transition-colors mr-2 text-left p-0"
                                    />
                                </div>

                                <button
                                    onClick={() => deletePit(p.id)}
                                    className="absolute -top-2 -right-2 bg-white dark:bg-slate-800 text-zinc-400 hover:text-red-500 hover:scale-110 transition-all p-1.5 rounded-full border border-zinc-200 dark:border-zinc-700 shadow-sm opacity-0 group-hover/pit:opacity-100 z-50"
                                >
                                    <Icon name="trash-2" size={14} />
                                </button>

                                <div
                                    className="relative bg-zinc-100 dark:bg-slate-800 border-[1.5px] border-zinc-200 dark:border-zinc-700 overflow-hidden flex flex-col justify-end shadow-inner"
                                    style={{
                                        width: `${p.w}px`,
                                        height: `${p.h}px`,
                                        borderRadius: `${14 * globalScale}px`,
                                        transition: (resizingPitId === p.id) ? 'none' : 'all 0.3s'
                                    }}
                                >
                                    <div
                                        className={`w-full transition-all duration-1000 ease-in-out ${currentType.color} relative pt-1`}
                                        style={{ height: `${fillPct}%` }}
                                    >
                                        <div className="absolute top-0 left-0 right-0 bg-white/20 animate-pulse" style={{ height: `${Math.min(6, 6 * hScale)}px` }}></div>
                                    </div>

                                    {/* Value Overlay */}
                                    <div className={`absolute inset-0 flex flex-col items-center p-2 text-center pointer-events-none ${innerH < 120 ? 'justify-start pt-1' : 'justify-center'}`}>
                                        <div className="flex flex-col items-center pointer-events-auto w-full">
                                            <div className={`flex items-baseline justify-center gap-1 w-full backdrop-blur-[3px] rounded-xl py-1 px-2 border border-white/20 shadow-sm transition-all ${((currentType.color === 'bg-zinc-900' && fillPct > 80) || (currentType.color !== 'bg-zinc-900' && fillPct > 82)) ? 'bg-black/40' : 'bg-black/20 dark:bg-white/10'}`}>
                                                <input
                                                    type="number"
                                                    value={displayVol(p.vol)}
                                                    onChange={e => updatePit(p.id, 'vol', parseVol(e.target.value))}
                                                    onKeyDown={handleEnter}
                                                    style={{
                                                        fontSize: `${Math.max(18, Math.min(32 * globalScale, innerH > 60 ? 32 * globalScale : innerH * 0.5))}px`,
                                                        lineHeight: 1,
                                                        textShadow: ((currentType.color === 'bg-zinc-900' && fillPct > 80) || (currentType.color !== 'bg-zinc-900' && fillPct > 82)) ? '0 2px 4px rgba(0,0,0,0.5)' : 'none'
                                                    }}
                                                    className={`bg-transparent border-none text-center font-black focus:ring-0 ${((currentType.color === 'bg-zinc-900' && fillPct > 80) || (currentType.color !== 'bg-zinc-900' && fillPct > 82)) ? 'text-white' : 'text-zinc-900 dark:text-white'} w-full transition-colors p-0 outline-none`}
                                                />
                                                {innerH > 75 && (
                                                    <span style={{ fontSize: `${Math.max(12, 11 * globalScale)}px` }}
                                                        className={`font-black uppercase tracking-widest ${((currentType.color === 'bg-zinc-900' && fillPct > 80) || (currentType.color !== 'bg-zinc-900' && fillPct > 82)) ? 'text-white/80' : 'text-zinc-600 dark:text-white/80'}`}>
                                                        {unitMode === 'metric' ? 'm³' : 'bbl'}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Bottom Details */}
                                    <div className={`absolute bottom-1 inset-x-1 flex justify-between items-center bg-black/60 backdrop-blur-lg border border-white/10 transition-all ${innerH < 65 ? 'opacity-0 scale-95 pointer-events-none' : 'opacity-100'}`}
                                        style={{ padding: `${3 * globalScale}px ${14 * globalScale}px`, borderRadius: `${10 * globalScale}px` }}>
                                        <div className="flex flex-col items-baseline leading-none">
                                            <span className="font-black text-white/50 uppercase tracking-tighter" style={{ fontSize: `${Math.max(9, 8 * globalScale)}px` }}>{getDensLabel()}</span>
                                            <input
                                                value={displayDens(p.density)}
                                                onChange={e => updatePit(p.id, 'density', parseDens(e.target.value))}
                                                style={{ fontSize: `${Math.max(13, 11 * globalScale)}px`, textShadow: '0 1px 2px rgba(0,0,0,0.5)' }}
                                                className="w-12 bg-transparent border-none font-bold text-white p-0 focus:ring-0 leading-none outline-none"
                                            />
                                        </div>
                                        <div className="flex flex-col items-end leading-none">
                                            <span className="font-black text-white/50 uppercase tracking-tighter" style={{ fontSize: `${Math.max(9, 8 * globalScale)}px` }}>CAP</span>
                                            <input
                                                value={displayVol(p.maxVol)}
                                                onChange={e => updatePit(p.id, 'maxVol', parseVol(e.target.value))}
                                                style={{ fontSize: `${Math.max(13, 11 * globalScale)}px`, textShadow: '0 1px 2px rgba(0,0,0,0.5)' }}
                                                className="w-12 bg-transparent border-none font-bold text-right text-white p-0 focus:ring-0 leading-none outline-none"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* High-Contrast Fluid Selector */}
                                <div className="relative" style={{ marginTop: `${8 * globalScale}px` }}>
                                    <select
                                        value={p.type}
                                        onChange={e => updatePit(p.id, 'type', e.target.value)}

// Conversor a RGB nativo para jsPDF
const hexToRgb = (hex) => {
  if (!hex || typeof hex !== 'string') return { r: 153, g: 27, b: 27 };
  let clean = hex.replace('#', '');
  if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
  return {
    r: parseInt(clean.substring(0, 2), 16) || 0,
    g: parseInt(clean.substring(2, 4), 16) || 0,
    b: parseInt(clean.substring(4, 6), 16) || 0
  };
};

const hexToRgbTint = (hex, alpha = 0.12) => {
  const rgb = hexToRgb(hex);
  return {
    r: Math.round(255 + (rgb.r - 255) * alpha),
    g: Math.round(255 + (rgb.g - 255) * alpha),
    b: Math.round(255 + (rgb.b - 255) * alpha)
  };
};

// Conversor a RGBA con opacidad tenue (12-16%) para DOM y CSS
const hexToRgba = (hex, alpha = 0.14) => {
  if (!hex || typeof hex !== 'string') return `rgba(153, 27, 27, ${alpha})`;
  let clean = hex.replace('#', '');
  if (clean.length === 3) clean = clean.split('').map(c => c + c).join('');
  const r = parseInt(clean.substring(0, 2), 16) || 0;
  const g = parseInt(clean.substring(2, 4), 16) || 0;
  const b = parseInt(clean.substring(4, 6), 16) || 0;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
};

const WarehouseLotsSystem = ({ isEditing, lang = 'es', setLang, darkMode, setDarkMode }) => {
  // Helper de traducción i18n
  const t = (key, params = {}) => {
    let str = I18N[lang]?.[key] || I18N['es'][key] || key;
    Object.keys(params).forEach(k => {
      str = str.replace(`{${k}}`, params[k]);
    });
    return str;
  };

  // 1. Estado persistente con Multi-Ring Vault y Rescate Automático
  const [data, setData] = useState(() => {
    let bestCandidate = null;

    // Prioridad 1: Leer el estado activo principal
    try {
      const primaryRaw = localStorage.getItem("lmp_warehouse_state");
      if (primaryRaw) {
        const parsedPrimary = JSON.parse(primaryRaw);
        if (parsedPrimary && (Array.isArray(parsedPrimary.pallets) || Array.isArray(parsedPrimary.sectors))) {
          bestCandidate = parsedPrimary;
        }
      }
    } catch (e) {
      console.warn("Error leyendo lmp_warehouse_state primario:", e);
    }

    // Prioridad 2: Fallback a vaults secundarios solo si no existe el estado primario
    if (!bestCandidate) {
      const fallbackKeys = [
        "lmp_warehouse_state_vault",
        "baroid_warehouse_backup_persistent",
        "lmp_warehouse_last_known_good",
        "lmp_warehouse_pre_update_snapshot",
        "warehouse_lots_data_v1",
        "baroid_warehouse_lots_v1",
        "warehouse_lots_backup"
      ];

      for (const key of fallbackKeys) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) continue;
          const parsed = JSON.parse(raw);
          if (parsed && (Array.isArray(parsed.pallets) || Array.isArray(parsed.sectors))) {
            bestCandidate = parsed;
            break;
          }
        } catch (e) {
          console.warn(`Error al leer fallback ${key}:`, e);
        }
      }
    }

    if (bestCandidate) {
      try {
        if (Array.isArray(bestCandidate.sectors) && bestCandidate.sectors.length > 0) {
          bestCandidate.sectors = bestCandidate.sectors
            .filter(s => s && !(s.name || "").toLowerCase().includes("1211") && !(s.id || "").toLowerCase().includes("1211"))
            .map(s => {
              const isDual = s.type === "dual";
              const isPrincipal = s.id === "principal" || (s.name || "").toLowerCase().includes("químicos") || (s.name || "").toLowerCase().includes("quimicos") || (s.name || "").toLowerCase().includes("principal");

              if (isPrincipal) {
                return {
                  ...s,
                  id: "principal",
                  name: "Zona de Productos Químicos",
                  type: isDual ? "dual" : "mixto",
                  rows: s.rows ? Math.max(1, Number(s.rows)) : (isDual ? 6 : 4),
                  columns: (s.columns && s.columns.length > 0)
                    ? s.columns
                    : (isDual ? ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"] : ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"])
                };
              }
              return {
                ...s,
                type: isDual ? "dual" : (s.type || "mixto"),
                rows: s.rows ? Math.max(1, Number(s.rows)) : (isDual ? 6 : 4),
                columns: (s.columns && s.columns.length > 0)
                  ? s.columns
                  : ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"]
              };
            });
          if (bestCandidate.sectors.length === 0) {
            bestCandidate.sectors = DEFAULT_FALLBACK_STATE.sectors;
          }
        } else {
          bestCandidate.sectors = DEFAULT_FALLBACK_STATE.sectors;
        }

        if (Array.isArray(bestCandidate.pallets)) {
          bestCandidate.pallets = bestCandidate.pallets
            .filter(p => p && !(p.sectorId || "").toLowerCase().includes("1211"))
            .map(p => {
              let prodName = String(p.product || '').trim();
              if (prodName === "Bentonita (Bolsón)" || prodName.toUpperCase().includes("BENTONITA")) {
                prodName = "Bentonita";
              } else if (prodName === "BAROID® (Barita Bolsones)" || prodName.includes("Barita Bolsones") || prodName.includes("BARITA EN BOLSONES") || prodName.toUpperCase() === "BAROID" || prodName.toUpperCase() === "BARITA") {
                prodName = "BAROID®";
              }

              return {
                ...p,
                product: prodName,
                col: String(p.col || p.column || '').trim().toUpperCase(),
                column: String(p.col || p.column || '').trim().toUpperCase(),
                row: Number(p.row)
              };
            });
        } else {
          bestCandidate.pallets = [];
        }

        if (!bestCandidate.warehouseDimensions) {
          bestCandidate.warehouseDimensions = {
            solidos: { rows: 6, columns: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"] },
            liquidos: { rows: 6, columns: ["A", "B", "C", "D", "E", "F", "G", "H"] }
          };
        }

        // Siempre sincronizar con el catálogo maestro oficial Baroid
        bestCandidate.productCatalog = OFFICIAL_BAROID_CATALOG;

        // Resincronizar de inmediato a todos los vaults para blindar persistencia
        try {
          const serialized = JSON.stringify(bestCandidate);
          localStorage.setItem("lmp_warehouse_state", serialized);
          localStorage.setItem("lmp_warehouse_state_vault", serialized);
          localStorage.setItem("baroid_warehouse_backup_persistent", serialized);
          if (bestCandidate.pallets.length > 0) {
            localStorage.setItem("lmp_warehouse_last_known_good", serialized);
          }
        } catch (e) {}

        return bestCandidate;
      } catch (e) {
        console.error("Error al procesar candidato de almacén:", e);
        if (Array.isArray(bestCandidate.pallets) && bestCandidate.pallets.length > 0) {
          return {
            ...DEFAULT_FALLBACK_STATE,
            pallets: bestCandidate.pallets,
            productCatalog: OFFICIAL_BAROID_CATALOG
          };
        }
      }
    }
    return DEFAULT_FALLBACK_STATE;
  });

  const [activeSectorId, setActiveSectorId] = useState(data.activeSectorId || "principal");
  const [selectedPallet, setSelectedPallet] = useState(null);
  const [copiedPallet, setCopiedPallet] = useState(null);
  const [draggedPallet, setDraggedPallet] = useState(null); // { pallet, zone, col, row, sectorId }
  const [dragOverTarget, setDragOverTarget] = useState(null); // { zone, col, row }
  const [activeFilter, setActiveFilter] = useState(null); // { type: 'lot' | 'product' | 'partial', value: string }
  const [searchQuery, setSearchQuery] = useState("");
  const [zoomLevel, setZoomLevel] = useState(1);
  const [undoStack, setUndoStack] = useState([]);
  const [toastMsg, setToastMsg] = useState(null);

  // Modales
  const [showReceptionModal, setShowReceptionModal] = useState(false);
  const [receptionTarget, setReceptionTarget] = useState(null);
  const [showPalletActionModal, setShowPalletActionModal] = useState(false);
  const [actionPallet, setActionPallet] = useState(null);
  const [stockEntryMode, setStockEntryMode] = useState("direct"); // "direct" (KG/LT) | "packages" (Bolsas/Unidades)
  const [remainingInputQty, setRemainingInputQty] = useState(0);
  const [remainingBagsCount, setRemainingBagsCount] = useState(0);
  const [remainingBagWeight, setRemainingBagWeight] = useState(25);
  const [showDimensionsModal, setShowDimensionsModal] = useState(false);
  const [showNewSectorModal, setShowNewSectorModal] = useState(false);
  const [showPrintModal, setShowPrintModal] = useState(false);

  // Estado para modal de Nueva Pestaña (Lienzo Único vs Doble Área)
  const [newTabStructure, setNewTabStructure] = useState('single'); // 'single' | 'dual'
  const [newTabRows, setNewTabRows] = useState(4);
  const [newTabCols, setNewTabCols] = useState(12);
  const [newTabSolidsRows, setNewTabSolidsRows] = useState(6);
  const [newTabSolidsCols, setNewTabSolidsCols] = useState(10);
  const [newTabLiquidsRows, setNewTabLiquidsRows] = useState(6);
  const [newTabLiquidsCols, setNewTabLiquidsCols] = useState(8);

  // Estado para modal de Recepción con Catálogo Oficial Baroid
  const [receptionSelectedProd, setReceptionSelectedProd] = useState(OFFICIAL_BAROID_CATALOG[0].name);
  const [receptionUnits, setReceptionUnits] = useState(50);
  const [receptionUnitWeight, setReceptionUnitWeight] = useState(25);
  const [isCustomProduct, setIsCustomProduct] = useState(false);
  const [customProdName, setCustomProdName] = useState("");
  const [customProdUnit, setCustomProdUnit] = useState("KG");

  // Sector actual
  const currentSector = useMemo(() => {
    const sec = (data.sectors && data.sectors.find(s => s.id === activeSectorId)) || data.sectors?.[0] || {
      id: "principal",
      name: "Zona de Productos Químicos",
      type: "mixto",
      rows: 4,
      columns: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"]
    };
    return sec;
  }, [data.sectors, activeSectorId]);

  // Dimensiones del sector activo garantizadas defensivamente
  const sDims = useMemo(() => {
    let raw;
    if (currentSector.type === "dual") {
      raw = currentSector.warehouseDimensions?.solidos || data.warehouseDimensions?.solidos || { rows: 6, columns: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"] };
    } else {
      raw = {
        rows: currentSector.rows || 4,
        columns: currentSector.columns || ["A","B","C","D","E","F","G","H","I","J","K","L"]
      };
    }
    return {
      rows: Math.max(1, Number(raw?.rows) || 4),
      columns: Array.isArray(raw?.columns) && raw.columns.length > 0 ? raw.columns : ["A","B","C","D","E","F","G","H","I","J","K","L"]
    };
  }, [currentSector, data.warehouseDimensions]);

  const lDims = useMemo(() => {
    let raw;
    if (currentSector.type === "dual") {
      raw = currentSector.warehouseDimensions?.liquidos || data.warehouseDimensions?.liquidos || { rows: 6, columns: ["A", "B", "C", "D", "E", "F", "G", "H"] };
    } else {
      raw = {
        rows: currentSector.rows || 4,
        columns: currentSector.columns || ["A","B","C","D"]
      };
    }
    return {
      rows: Math.max(1, Number(raw?.rows) || 4),
      columns: Array.isArray(raw?.columns) && raw.columns.length > 0 ? raw.columns : ["A","B","C","D"]
    };
  }, [currentSector, data.warehouseDimensions]);

  // Mapas Hash O(1) para eliminar lag en renderizado de celdas y hover con indexación estricta sin fugas de zona
  const palletsMap = useMemo(() => {
    const map = new Map();
    if (!data.pallets) return map;
    const sId = currentSector.id || activeSectorId || "principal";
    const isDual = currentSector.type === "dual";

    for (let i = 0; i < data.pallets.length; i++) {
      const p = data.pallets[i];
      if (!p || (p.sectorId || "principal") !== sId || Number(p.quantity) <= 0) continue;

      const pCol = String(p.col || p.column || '').trim().toUpperCase();
      const pRow = Number(p.row);

      if (isDual) {
        const isLiq = p.zone === "liquidos" || p.zone === "liquido";
        const zKey = isLiq ? "liquidos" : "solidos";
        map.set(`${zKey}_${pCol}_${pRow}`, p);
        map.set(`${p.zone}_${pCol}_${pRow}`, p);
      } else {
        // En sector de lienzo único (mixto): indexar por coordenadas de celda
        map.set(`${pCol}_${pRow}`, p);
        map.set(`mixto_${pCol}_${pRow}`, p);
        map.set(`solidos_${pCol}_${pRow}`, p);
        map.set(`${p.zone}_${pCol}_${pRow}`, p);
      }
    }
    return map;
  }, [data.pallets, currentSector, activeSectorId]);

  // Helper universal de consulta O(1) de pallet por posición para garantizar coincidencia 100% idéntica entre App y PDF
  const getPalletAt = (zone, col, row) => {
    const cCol = String(col || '').trim().toUpperCase();
    const cRow = Number(row);
    const isDual = currentSector.type === "dual";
    const zKey = (zone === "liquidos" || zone === "liquido") ? "liquidos" : "solidos";

    if (isDual) {
      return (
        palletsMap.get(`${zKey}_${cCol}_${cRow}`) ||
        palletsMap.get(`${zone}_${cCol}_${cRow}`) ||
        null
      );
    }
    // Lienzo único / sector mixto o general
    return (
      palletsMap.get(`${cCol}_${cRow}`) ||
      palletsMap.get(`mixto_${cCol}_${cRow}`) ||
      palletsMap.get(`solidos_${cCol}_${cRow}`) ||
      palletsMap.get(`${zone}_${cCol}_${cRow}`) ||
      null
    );
  };

  const productCatalogMap = useMemo(() => {
    const map = new Map();
    const catalog = data.productCatalog?.length ? data.productCatalog : OFFICIAL_BAROID_CATALOG;
    for (let i = 0; i < catalog.length; i++) {
      map.set(catalog[i].name, catalog[i]);
    }
    return map;
  }, [data.productCatalog]);

  // Dimensiones físicas de cada pallet calculadas con el zoom (relación de aspecto perfecta 98x80)
  const cardWidth = Math.round(98 * zoomLevel);
  const cardHeight = Math.round(80 * zoomLevel);
  const aisleWidth = Math.max(10, Math.round(16 * zoomLevel));

  // Refs de scroll horizontal
  const solidsScrollRef = useRef(null);
  const liquidsScrollRef = useRef(null);

  // Auto-Toast Helper
  const showToast = (text, type = "info") => {
    setToastMsg({ text, type, id: Date.now() });
  };

  useEffect(() => {
    if (!toastMsg) return;
    const timer = setTimeout(() => setToastMsg(null), 3500);
    return () => clearTimeout(timer);
  }, [toastMsg]);

  // Persistencia Multi-Ring Vault en cada cambio de data
  const persistData = (nextData, pushUndo = true) => {
    if (pushUndo) {
      setUndoStack(prev => [...prev.slice(-19), JSON.stringify(data)]);
    }
    nextData.lastUpdated = new Date().toISOString();
    setData(nextData);

    const serialized = JSON.stringify(nextData);
    try {
      localStorage.setItem("lmp_warehouse_state", serialized);
      localStorage.setItem("lmp_warehouse_state_vault", serialized);
      localStorage.setItem("baroid_warehouse_backup_persistent", serialized);

      // Guardar en 'lmp_warehouse_last_known_good' únicamente si contiene pallets cargados
      if (Array.isArray(nextData.pallets) && nextData.pallets.length > 0) {
        localStorage.setItem("lmp_warehouse_last_known_good", serialized);
        localStorage.setItem("lmp_warehouse_last_known_good_time", Date.now().toString());
      }
    } catch (err) {
      console.error("Error saving warehouse state to vault:", err);
    }
  };

  // Restaurar Copia de Seguridad Automática / Último Buen Estado Conocido
  const handleRestoreSafeBackup = () => {
    const candidateKeys = [
      "lmp_warehouse_last_known_good",
      "baroid_warehouse_backup_persistent",
      "lmp_warehouse_pre_wipe_backup",
      "lmp_warehouse_pre_update_snapshot",
      "lmp_warehouse_state_vault"
    ];

    let foundBackup = null;
    let foundCount = 0;

    for (const key of candidateKeys) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.pallets) && parsed.pallets.length > 0) {
          if (parsed.pallets.length > foundCount) {
            foundBackup = parsed;
            foundCount = parsed.pallets.length;
          }
        }
      } catch (e) {}
    }

    if (!foundBackup || foundCount === 0) {
      showToast(lang === 'en' ? "No backup with pallets found in this browser." : "No se encontró ningún respaldo con pallets en este navegador.", "warning");
      return;
    }

    const confirmMsg = lang === 'en'
      ? `The last safe backup with ${foundCount} pallets and lots will be restored. Do you want to apply it now?`
      : `Se restaurará la última copia de seguridad segura encontrada con ${foundCount} pallets y lotes. ¿Deseas aplicarla ahora?`;

    if (confirm(confirmMsg)) {
      persistData(foundBackup);
      showToast(lang === 'en' ? `✓ Backup restored: ${foundCount} pallets recovered.` : `✓ Respaldo restaurado con éxito: ${foundCount} pallets recuperados.`, "success");
    }
  };

  const undoLastAction = () => {
    if (undoStack.length === 0) return;
    const prev = undoStack[undoStack.length - 1];
    setUndoStack(prevStack => prevStack.slice(0, -1));
    try {
      const parsed = JSON.parse(prev);
      setData(parsed);
      const serialized = JSON.stringify(parsed);
      localStorage.setItem("lmp_warehouse_state", serialized);
      localStorage.setItem("lmp_warehouse_state_vault", serialized);
      localStorage.setItem("baroid_warehouse_backup_persistent", serialized);
      showToast(t("undoSuccess"), "warning");
    } catch (e) {
      console.error("Undo error:", e);
    }
  };

  const fileInputRef = useRef(null);

  // Importar Inventario desde Archivo JSON
  const handleImportInventoryJson = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const imported = JSON.parse(event.target.result);
        if (!imported || !Array.isArray(imported.pallets)) {
          showToast(t("invalidJsonFormat"), "error");
          return;
        }

        // Normalización preventiva y preservación estricta de variantes de productos oficiales Baroid
        const normalizedPallets = imported.pallets.map(p => {
          let prodName = String(p.product || "").trim();

          if (prodName === "Bentonita (Bolsón)" || prodName.toUpperCase().includes("BENTONITA")) {
            prodName = "Bentonita";
          } else if (prodName === "BAROID® (Barita Bolsones)" || prodName.includes("Barita Bolsones") || prodName.includes("BARITA EN BOLSONES") || prodName.toUpperCase() === "BAROID" || prodName.toUpperCase() === "BARITA") {
            prodName = "BAROID®";
          } else if (prodName.includes("Calcio") || prodName.includes("CaCl")) {
            prodName = "Cloruro de Calcio (CaCl₂)";
          } else if (prodName.includes("BARABLOK")) {
            prodName = "BARABLOK™ 400 NA";
          } else if (prodName.includes("BARACARB")) {
            if (prodName.toUpperCase().includes("COARSE") || prodName.toUpperCase().includes("GRUESO")) prodName = "BARACARB®-DF COARSE";
            else if (prodName.toUpperCase().includes("MEDIUM") || prodName.toUpperCase().includes("MEDIO")) prodName = "BARACARB®-DF MEDIUM";
            else prodName = "BARACARB®-DF FINE";
          } else if (prodName.includes("INVERMUL")) {
            if (prodName.toUpperCase().includes("LA")) prodName = "INVERMUL® LA";
            else prodName = "INVERMUL®";
          } else if (prodName.includes("EZ MUL") || prodName.includes("EZMUL")) {
            if (prodName.toUpperCase().includes("NT")) prodName = "EZ MUL® NT";
            else prodName = "EZ MUL® LA";
          } else if (prodName.includes("BARASHIELD") || prodName.includes("BaraShield")) {
            if (prodName.includes("982")) prodName = "BaraShield®-982";
            else prodName = "BaraShield®-981";
          } else if (prodName.includes("BDF") || prodName.includes("bdf")) {
            if (prodName.toUpperCase().includes("MEDIUM") || prodName.toUpperCase().includes("MEDIO")) prodName = "BDF™-965 MEDIUM";
            else prodName = "BDF™-965 FINE";
          } else if (prodName.includes("DRILTREAT")) {
            prodName = "DRILTREAT®";
          } else if (prodName.includes("GELTONE")) {
            prodName = "GELTONE® II";
          } else if (prodName.includes("RM-63") || prodName.includes("RM 63")) {
            prodName = "RM-63™";
          } else if (prodName.includes("LIME")) {
            prodName = "LIME FG";
          }

          return {
            ...p,
            product: prodName,
            sectorId: p.sectorId || "principal"
          };
        });

        const hasLiquids = normalizedPallets.some(p => p.zone === "liquidos");
        let importedSectors = imported.sectors || data.sectors;
        if (hasLiquids && Array.isArray(importedSectors)) {
          importedSectors = importedSectors.map(s => {
            if (s.id === "principal" || s.name?.toLowerCase().includes("nave principal") || s.name?.toLowerCase().includes("productos")) {
              return { ...s, type: "dual" };
            }
            return s;
          });
        }

        const nextData = {
          ...data,
          ...imported,
          pallets: normalizedPallets,
          sectors: importedSectors,
          productCatalog: OFFICIAL_BAROID_CATALOG,
          warehouseDimensions: imported.warehouseDimensions || data.warehouseDimensions
        };

        persistData(nextData);
        showToast(t("jsonLoadSuccess", { count: normalizedPallets.length }), "success");
      } catch (err) {
        console.error("Error importando JSON:", err);
        showToast(t("jsonLoadError"), "error");
      }
    };
    reader.readAsText(file, "UTF-8");
    e.target.value = '';
  };

    const link = document.createElement("a");

  // Helper centralizado para generar el documento PDF vectorial nativo (A4 Apaisado - 1 sola página, ultra nítido y legible)

          for (let r = 1; r <= lRows; r++) {

            if (p && Number(p.quantity) > 0) {

  // Abrir directamente el PDF en una pestaña nueva para visualizarlo y decidir si guardarlo o imprimirlo
  const handleOpenPdf = () => {
    try {
      showToast(lang === 'es' ? "Generando y abriendo PDF..." : "Generating and opening PDF...", "info");
      const result = generatePdfBlob();
      if (!result || !result.doc) {
        // Fallback nativo
        window.print();
        return;
      }

      if (result.blob) {
        const blobUrl = URL.createObjectURL(result.blob);
        const newTab = window.open(blobUrl, '_blank');
        if (!newTab || newTab.closed || typeof newTab.closed === 'undefined') {
          result.doc.save(result.filename);
          showToast(lang === 'es' ? "Descargando PDF (popup bloqueado)." : "Downloading PDF (popup blocked).", "success");
        } else {
          showToast(lang === 'es' ? "PDF abierto en pantalla. Puede guardarlo o imprimirlo." : "PDF opened in new tab.", "success");
        }
      } else {
        result.doc.save(result.filename);
        showToast(lang === 'es' ? "Descargando archivo PDF..." : "Downloading PDF...", "success");
      }
    } catch (err) {
      console.error("Error in handleOpenPdf:", err);
      window.print();
    }
  };

      if (!result || !result.doc) {
        window.print();
        return;
      }

      result.doc.save(result.filename);
      showToast(t("pdfSuccessToast") || "PDF guardado con éxito.", "success");

      console.error("Error in handleDownloadPdf:", err);
      window.print();
